name: paraselene_flutter
description: "Paraselene Windows M1 synthetic bridge acceptance runner."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_rust_bridge: 2.11.1
  file_selector_platform_interface: 2.7.0
  file_selector_windows: 0.9.3+5
  text_contract:
    path: ../../packages/text_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-OFL.txt
    - assets/fonts/NotoSerifSC-OFL.txt
    - assets/fonts/NotoNaskhArabic-OFL.txt
  fonts:
    - family: Notebook Sans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Semibold.ttf
          weight: 600
    - family: Notebook Serif
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
    - family: Noto Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf

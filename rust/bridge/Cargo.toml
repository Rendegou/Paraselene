[package]
name = "paraselene-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
test-support = ["paraselene-application/test-support"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
paraselene-application = { path = "../application" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

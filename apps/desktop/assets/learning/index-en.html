<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paraselene · Five-minute exercise</title>
  <link rel="stylesheet" href="/learning.css">
</head>
<body>
  <main>
    <p class="eyebrow">Paraselene · Five-minute exercise</p>
    <h1>Write a small function</h1>
    <p class="intro">Make <code>double(x)</code> return twice its input. Run the tests, edit, and try again.</p>
    <label for="code">Python code</label>
    <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off">def double(x):
    # Write your answer here
    pass</textarea>
    <div class="actions"><button id="run" type="button">Run tests</button><button id="hint" type="button" class="secondary">Show a hint</button><button id="reset" type="button" class="secondary">Reset exercise</button></div>
    <p id="hint-text" class="hint" aria-live="polite"></p>
    <p id="status" role="status" aria-live="polite">Runs locally. Python loads only when you start the exercise.</p>
    <pre id="result" aria-live="polite"></pre>
    <p class="footnote">Code runs in an isolated worker. Close this window to end the exercise.</p>
  </main>
  <script src="/learning-en.js"></script>
</body>
</html>

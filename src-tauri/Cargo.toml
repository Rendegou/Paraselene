[package]
name = "paraselene"
version = "0.1.0"
edition = "2021"
description = "幻月桌宠外壳：窗口/托盘/IPC 转发。业务逻辑一律放 crates/，本 crate 不写业务（AGENTS.md §3）"

[lib]
name = "paraselene_lib"
# 仅 rlib：幻月是 Windows-only 桌宠，不需要移动端的 staticlib/cdylib；
# 且 rustup 自包含模式的 lld 链接 cdylib 时触发 export ordinal 上限（90895 > 65535），见 docs/adr/0001。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
paraselene-memory-core = { path = "../crates/memory-core" }
paraselene-llm-core = { path = "../crates/llm-core" }
# llm_chat_send 消费 llm-core 的事件流（StreamExt::next）
futures-util = "0.3"
# G15：Key 存 Windows 凭据管理器（系统安全存储），Key 永不出 Rust 侧
keyring = "4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package]
name = "paraselene-llm-core"
version = "0.1.0"
edition = "2021"
description = "幻月 LLM 层：OpenAI 兼容流式 + SSE 状态机 + 外发前预览（DeepSeek BYOK）。纯 Rust，不依赖 Tauri，可独立 cargo test"
license = "MIT"

[dependencies]
# HTTP：rustls 纯 Rust TLS（windows-gnu 无 OpenSSL 依赖，ADR-0001 工具链可编译）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# bytes_stream 的 Stream 适配（轻量，不引 async-std/tokio-stream）
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# 测试 runtime（mock TCP server 用 std 线程，不需要 tokio 网络）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
